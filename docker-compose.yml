services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - CONFIG_PATH=/app/config.yaml
      - PORT=8080
      - DATA_DIR=/app/data
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=rag
      - VECTOR_SIZE=384
      - WORKERS=4
      - RAG_REQUIRE_CONTEXT=true
      - RAG_HYBRID_SEARCH=true
      - RAG_MULTI_QUERY=true
      - RAG_QUERY_VARIANTS=3
      - RAG_VECTOR_LIMIT=40
      - RAG_KEYWORD_LIMIT=40
      - RAG_RERANK_LIMIT=25
      - RAG_FINAL_LIMIT=8
      - RAG_MIN_SCORE=0.05
      - RAG_SEMANTIC_WEIGHT=0.55
      - RAG_KEYWORD_WEIGHT=0.20
      - RAG_RERANK_WEIGHT=0.25
      - RAG_MMR_LAMBDA=0.82
      - RAG_CHUNK_CHARS=1200
      - RAG_CHUNK_OVERLAP_CHARS=180
      - RAG_CONTEXT_MAX_CHARS=16000
      - RERANKER_ENABLED=true
      - RERANKER_PROVIDER=bge
      - RERANKER_BASE_URL=http://bge-reranker:8080
      - RERANKER_MODEL=BAAI/bge-reranker-base
      - RERANKER_TIMEOUT_SECONDS=120
      - RERANKER_TOP_N=25
      - RERANKER_NORMALIZE=true
      - RERANKER_FAIL_CLOSED=false
      - QDRANT_TIMEOUT_SECONDS=15
      - QDRANT_UPSERT_BATCH_SIZE=64
      - LLM_ENABLED=false
      - LLM_PROVIDER=ollama
      - LLM_BASE_URL=http://ollama:11434
      - LLM_MODEL=llama3.1:8b
      - LLM_TIMEOUT_SECONDS=120
      - LLM_REQUIRE_CONTEXT=true
      - LLM_TEMPERATURE=0.1
      - LLM_MAX_CONTEXT_CHUNKS=6
      - LLM_MAX_CONTEXT_CHARS=12000
      - LLM_MAX_ANSWER_TOKENS=900
      - OBJECT_STORAGE_ENABLED=false
      - OBJECT_STORAGE_REQUIRED=false
      - OBJECT_STORAGE_PROVIDER=oci-par
      - OBJECT_STORAGE_PAR_URL=
      - OBJECT_STORAGE_PREFIX=rag-unified
      - OBJECT_STORAGE_PUBLIC_BASE_URL=
      - OBJECT_STORAGE_TIMEOUT_SECONDS=120
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - qdrant
      - bge-reranker

  qdrant:
    image: qdrant/qdrant:1.13.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Optional local LLM. Start with: docker compose --profile llm up --build
  # Then pull a model once: docker compose exec ollama ollama pull llama3.1:8b
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["llm"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  qdrant_data:
  hf_cache:
  ollama_data:
